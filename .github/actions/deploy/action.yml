name: Deploy
description: '공통 배포 로직 - deploy.yml, deploy-dev.yml에서 호출'

inputs:
  image_tag:
    description: 'Docker image tag (dev or latest)'
    required: true
  compose_file:
    description: 'docker-compose 파일명'
    required: true
  appcheck_enabled:
    description: 'App Check 활성화 여부'
    required: true
  lightsail_ssh_key:
    required: true
  lightsail_host:
    required: true
  firebase_service_account_json:
    required: true
  db_name:
    required: true
  db_user:
    required: true
  db_password:
    required: true
  db_root_password:
    required: true
  airkorea_api_key:
    required: true
  admin_api_key:
    required: true
  github_token:
    required: true

runs:
  using: composite
  steps:
    # 1. Docker Buildx 설정
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 2. ghcr.io 로그인
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    # 3. Docker 이미지 빌드 + 푸시
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/devchoi-lab/aircheck-server:${{ inputs.image_tag }}
          ghcr.io/devchoi-lab/aircheck-server:${{ inputs.image_tag == 'latest' && github.sha || format('{0}-{1}', inputs.image_tag, github.sha) }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 4. SSH 키 설정
    - name: Setup SSH
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.lightsail_ssh_key }}" > ~/.ssh/lightsail.pem
        chmod 600 ~/.ssh/lightsail.pem
        ssh-keyscan -H ${{ inputs.lightsail_host }} >> ~/.ssh/known_hosts
        cat <<EOF >> ~/.ssh/config
        Host lightsail
            HostName ${{ inputs.lightsail_host }}
            User ec2-user
            IdentityFile ~/.ssh/lightsail.pem
        EOF

    # 5. Firebase 서비스 계정 키 갱신
    - name: Write Firebase key
      shell: bash
      run: |
        cat <<'FBEOF' > /tmp/firebase-key.json
        ${{ inputs.firebase_service_account_json }}
        FBEOF
    - name: Upload Firebase key
      shell: bash
      run: |
        scp /tmp/firebase-key.json lightsail:/opt/aircheck/firebase-key.json
        ssh lightsail "sudo chmod 644 /opt/aircheck/firebase-key.json"

    # 6. 환경변수 파일 갱신
    - name: Update environment file
      shell: bash
      run: |
        ssh lightsail \
          "cat <<'ENVEOF' | sudo tee /opt/aircheck/aircheck.env > /dev/null
        DB_HOST=db
        DB_PORT=3306
        DB_NAME=${{ inputs.db_name }}
        DB_USER=${{ inputs.db_user }}
        DB_PASSWORD=${{ inputs.db_password }}
        DB_ROOT_PASSWORD=${{ inputs.db_root_password }}
        AIRKOREA_API_KEY=${{ inputs.airkorea_api_key }}
        WEATHER_PROVIDER=kma
        ADMIN_API_KEY=${{ inputs.admin_api_key }}
        APPCHECK_ENABLED=${{ inputs.appcheck_enabled }}
        ENVEOF
        sudo chown ec2-user:ec2-user /opt/aircheck/aircheck.env && \
        sudo chmod 600 /opt/aircheck/aircheck.env"

    # 7. compose 파일 동기화
    - name: Upload compose file
      shell: bash
      run: |
        scp ${{ inputs.compose_file }} lightsail:/opt/aircheck/${{ inputs.compose_file }}

    # 8. 새 이미지로 컨테이너 교체
    - name: Deploy with Docker Compose
      shell: bash
      run: |
        ssh lightsail \
          "echo ${{ inputs.github_token }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin && \
           cd /opt/aircheck && \
           docker compose --env-file aircheck.env -f ${{ inputs.compose_file }} pull app && \
           docker compose --env-file aircheck.env -f ${{ inputs.compose_file }} up -d"

    # 9. 헬스 체크
    - name: Health Check
      shell: bash
      run: |
        echo "Waiting for app to start..."
        sleep 60
        curl -f http://${{ inputs.lightsail_host }}:8080/actuator/health || exit 1
        echo "Deploy successful!"

    # 10. 안 쓰는 이미지 정리
    - name: Clean up old images
      shell: bash
      run: |
        ssh lightsail "docker image prune -f"
