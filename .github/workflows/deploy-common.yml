name: Deploy Common

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub Environment (dev or prod)'
        required: true
        type: string
      image_tag:
        description: 'Docker image tag (dev or latest)'
        required: true
        type: string
      compose_file:
        description: 'docker-compose 파일명'
        required: true
        type: string
      appcheck_enabled:
        description: 'App Check 활성화 여부'
        required: true
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. ghcr.io 로그인
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Docker 이미지 빌드 + 푸시
      # sha 태그: latest면 그대로, 그 외엔 {tag}-{sha} 형식
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/devchoi-lab/aircheck-server:${{ inputs.image_tag }}
            ghcr.io/devchoi-lab/aircheck-server:${{ inputs.image_tag == 'latest' && github.sha || format('{0}-{1}', inputs.image_tag, github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. SSH 키 설정
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts
          cat <<EOF >> ~/.ssh/config
          Host lightsail
              HostName ${{ secrets.LIGHTSAIL_HOST }}
              User ec2-user
              IdentityFile ~/.ssh/lightsail.pem
          EOF

      # 6. Firebase 서비스 계정 키 갱신
      - name: Write Firebase key
        run: |
          cat <<'FBEOF' > /tmp/firebase-key.json
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FBEOF
      - name: Upload Firebase key
        run: |
          scp /tmp/firebase-key.json lightsail:/opt/aircheck/firebase-key.json
          ssh lightsail "sudo chmod 644 /opt/aircheck/firebase-key.json"

      # 7. 환경변수 파일 갱신
      - name: Update environment file
        run: |
          ssh lightsail \
            "cat <<'ENVEOF' | sudo tee /opt/aircheck/aircheck.env > /dev/null
          DB_HOST=db
          DB_PORT=3306
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
          AIRKOREA_API_KEY=${{ secrets.AIRKOREA_API_KEY }}
          WEATHER_PROVIDER=kma
          ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}
          APPCHECK_ENABLED=${{ inputs.appcheck_enabled }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_PROJECT_NUMBER=${{ secrets.FIREBASE_PROJECT_NUMBER }}
          ENVEOF
          sudo chown ec2-user:ec2-user /opt/aircheck/aircheck.env && \
          sudo chmod 600 /opt/aircheck/aircheck.env"

      # 8. compose 파일 동기화
      - name: Upload compose file
        run: |
          scp ${{ inputs.compose_file }} lightsail:/opt/aircheck/${{ inputs.compose_file }}

      # 9. 새 이미지로 컨테이너 교체
      - name: Deploy with Docker Compose
        run: |
          ssh lightsail \
            "echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin && \
             cd /opt/aircheck && \
             docker compose --env-file aircheck.env -f ${{ inputs.compose_file }} pull app && \
             docker compose --env-file aircheck.env -f ${{ inputs.compose_file }} up -d"

      # 10. 헬스 체크
      - name: Health Check
        run: |
          echo "Waiting for app to start..."
          sleep 60
          curl -f http://${{ secrets.LIGHTSAIL_HOST }}:8080/actuator/health || exit 1
          echo "[${{ inputs.environment }}] Deploy successful!"

      # 11. 안 쓰는 이미지 정리
      - name: Clean up old images
        run: |
          ssh lightsail "docker image prune -f"
