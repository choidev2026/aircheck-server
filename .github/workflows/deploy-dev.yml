name: Deploy to Dev

# main 브랜치에 푸시될 때 자동 실행 (prod는 master 푸시 시 실행)
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    uses: ./.github/workflows/deploy-common.yml
    with:
      environment: dev
      image_tag: dev
      compose_file: docker-compose.dev.yml
      appcheck_enabled: "false"
    secrets: inherit
