name: Deploy to Lightsail

# main 브랜치에 푸시될 때 실행
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. ghcr.io 로그인 (private 패키지로 운영 - #52)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Docker 이미지 빌드 + 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/choidev2026/aircheck-server:latest
            ghcr.io/choidev2026/aircheck-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. SSH 키 설정
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts

      # 6. 환경변수 파일 갱신 (API 키 등은 GitHub Secrets에서 관리)
      # DB_HOST=db - 앱도 이제 컨테이너라 compose 내부망의 서비스 이름으로 접근
      - name: Update environment file
        run: |
          ssh -i ~/.ssh/lightsail.pem ec2-user@${{ secrets.LIGHTSAIL_HOST }} \
            "cat <<'ENVEOF' | sudo tee /opt/aircheck/aircheck.env > /dev/null
          DB_HOST=db
          DB_PORT=3306
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
          AIRKOREA_API_KEY=${{ secrets.AIRKOREA_API_KEY }}
          WEATHER_PROVIDER=kma
          ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}
          APPCHECK_ENABLED=true
          ENVEOF
          sudo chmod 600 /opt/aircheck/aircheck.env"

      # 7. 새 이미지로 컨테이너 교체 (app만 pull - db는 매번 갈아탈 필요 없음)
      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/lightsail.pem ec2-user@${{ secrets.LIGHTSAIL_HOST }} \
            "cd /opt/aircheck && \
             docker compose --env-file aircheck.env -f docker-compose.prod.yml pull app && \
             docker compose --env-file aircheck.env -f docker-compose.prod.yml up -d"

      # 8. 헬스 체크 (앱 시작에 ~20초 소요)
      - name: Health Check
        run: |
          echo "Waiting for app to start..."
          sleep 30
          curl -f http://${{ secrets.LIGHTSAIL_HOST }}:8080/actuator/health || exit 1
          echo "✅ Deploy successful!"
