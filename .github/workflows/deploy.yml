name: Deploy to Lightsail

# main 브랜치에 푸시될 때 실행
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4
      
      # 2. Java 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
      
      # 3. Gradle 캐시
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      
      # 4. JAR 빌드
      - name: Build JAR
        run: ./gradlew :app:bootJar
      
      # 5. SSH 키 설정
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts
      
      # 6. JAR 업로드
      - name: Upload JAR
        run: |
          scp -i ~/.ssh/lightsail.pem \
            app/build/libs/app.jar \
            ec2-user@${{ secrets.LIGHTSAIL_HOST }}:/opt/aircheck/app.jar

      # 6.5. 환경변수 파일 갱신 (DB 계정정보는 GitHub Secrets에서 관리)
      - name: Update environment file
        run: |
          ssh -i ~/.ssh/lightsail.pem ec2-user@${{ secrets.LIGHTSAIL_HOST }} \
            "cat <<'ENVEOF' | sudo tee /opt/aircheck/aircheck.env > /dev/null
          DB_HOST=localhost
          DB_PORT=3306
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          ENVEOF
          sudo chmod 600 /opt/aircheck/aircheck.env"

      # 7. 서비스 재시작
      - name: Restart Service
        run: |
          ssh -i ~/.ssh/lightsail.pem ec2-user@${{ secrets.LIGHTSAIL_HOST }} \
            "sudo systemctl restart aircheck"
      
      # 8. 헬스 체크 (앱 시작에 ~20초 소요)
      - name: Health Check
        run: |
          echo "Waiting for app to start..."
          sleep 30
          curl -f http://${{ secrets.LIGHTSAIL_HOST }}:8080/actuator/health || exit 1
          echo "✅ Deploy successful!"

      # --- 여기부터는 #52(Docker 전환) 준비 단계 ---
      # 아직 실제 배포(위 7~8번)는 안 거침 - 이미지를 ghcr.io에 쌓아두기만 함.
      # 기존 JAR 배포가 끝난 뒤에 두도록 해서, 이 단계가 실패해도 실제 배포엔 영향 없음.

      # 9. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 10. ghcr.io 로그인 (private 패키지로 운영 - #52)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 11. Docker 이미지 빌드 + 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/choidev2026/aircheck-server:latest
            ghcr.io/choidev2026/aircheck-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
