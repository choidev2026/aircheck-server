name: Deploy to Lightsail

# main 브랜치에 푸시될 때 실행
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. ghcr.io 로그인 (private 패키지로 운영 - #52)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Docker 이미지 빌드 + 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/choidev2026/aircheck-server:latest
            ghcr.io/choidev2026/aircheck-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. SSH 키 설정
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts

      # 6. Firebase 서비스 계정 키 갱신
      # JSON 안에 "가 많아서 ssh 명령 문자열에 바로 못 끼워넣음(바깥 "..."가 깨짐) ->
      # 로컬 파일로 먼저 쓰고(따옴표 처리 안전한 heredoc) scp로 올림
      - name: Write Firebase key
        run: |
          cat <<'FBEOF' > /tmp/firebase-key.json
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FBEOF
      - name: Upload Firebase key
        run: |
          scp -i ~/.ssh/lightsail.pem /tmp/firebase-key.json ec2-user@${{ secrets.LIGHTSAIL_HOST }}:/opt/aircheck/firebase-key.json
          # 644인 이유: 컨테이너는 non-root(spring) 유저로 도는데, 바인드 마운트는 호스트 파일
          # 권한을 그대로 적용받음 - 600이면 ec2-user만 읽을 수 있어서 컨테이너 안에선 Permission denied
          ssh -i ~/.ssh/lightsail.pem ec2-user@${{ secrets.LIGHTSAIL_HOST }} "sudo chmod 644 /opt/aircheck/firebase-key.json"

      # 7. 환경변수 파일 갱신 (API 키 등은 GitHub Secrets에서 관리)
      # DB_HOST=db - 앱도 이제 컨테이너라 compose 내부망의 서비스 이름으로 접근
      - name: Update environment file
        run: |
          ssh -i ~/.ssh/lightsail.pem ec2-user@${{ secrets.LIGHTSAIL_HOST }} \
            "cat <<'ENVEOF' | sudo tee /opt/aircheck/aircheck.env > /dev/null
          DB_HOST=db
          DB_PORT=3306
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
          AIRKOREA_API_KEY=${{ secrets.AIRKOREA_API_KEY }}
          WEATHER_PROVIDER=kma
          ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}
          APPCHECK_ENABLED=true
          ENVEOF
          sudo chmod 600 /opt/aircheck/aircheck.env"

      # 8. 새 이미지로 컨테이너 교체 (app만 pull - db는 매번 갈아탈 필요 없음)
      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/lightsail.pem ec2-user@${{ secrets.LIGHTSAIL_HOST }} \
            "cd /opt/aircheck && \
             docker compose --env-file aircheck.env -f docker-compose.prod.yml pull app && \
             docker compose --env-file aircheck.env -f docker-compose.prod.yml up -d"

      # 9. 헬스 체크 (컨테이너 기동 실측 ~55초 - JAR 직접 실행보다 오래 걸림)
      - name: Health Check
        run: |
          echo "Waiting for app to start..."
          sleep 60
          curl -f http://${{ secrets.LIGHTSAIL_HOST }}:8080/actuator/health || exit 1
          echo "✅ Deploy successful!"

      # 10. 안 쓰는 이미지 정리 (#52 7단계)
      # docker-compose.prod.yml이 app을 :latest로만 참조해서, 배포마다 옛 버전이
      # <none> 태그로 남음 - 지금 쓰는 이미지(태그 있음, 컨테이너가 참조 중)는
      # prune 대상이 아니라서 안전하게 "마지막 버전만 남기고 정리"가 됨.
      # 진짜 롤백 필요하면 ghcr.io에 커밋 SHA 태그로 남아있어서 거기서 다시 pull하면 됨.
      - name: Clean up old images
        run: |
          ssh -i ~/.ssh/lightsail.pem ec2-user@${{ secrets.LIGHTSAIL_HOST }} "docker image prune -f"
