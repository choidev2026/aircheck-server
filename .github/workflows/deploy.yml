name: Deploy to Lightsail

# main 브랜치에 푸시될 때 실행
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4
      
      # 2. Java 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
      
      # 3. Gradle 캐시
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      
      # 4. JAR 빌드
      - name: Build JAR
        run: ./gradlew :app:bootJar
      
      # 5. SSH 키 설정
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts
      
      # 6. JAR 업로드
      - name: Upload JAR
        run: |
          scp -i ~/.ssh/lightsail.pem \
            app/build/libs/app-0.0.1-SNAPSHOT.jar \
            ec2-user@${{ secrets.LIGHTSAIL_HOST }}:/opt/aircheck/app.jar
      
      # 7. 서비스 재시작
      - name: Restart Service
        run: |
          ssh -i ~/.ssh/lightsail.pem ec2-user@${{ secrets.LIGHTSAIL_HOST }} \
            "sudo systemctl restart aircheck"
      
      # 8. 헬스 체크
      - name: Health Check
        run: |
          sleep 15
          curl -f http://${{ secrets.LIGHTSAIL_HOST }}:8080/actuator/health || exit 1
          echo "✅ Deploy successful!"
