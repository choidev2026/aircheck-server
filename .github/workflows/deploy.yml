name: Deploy to Lightsail

# master 브랜치에 푸시될 때 실행 (prod 배포)
on:
  push:
    branches: [ master ]

jobs:
  deploy:
    environment: prod
    uses: ./.github/workflows/deploy-common.yml
    with:
      environment: prod
      image_tag: latest
      compose_file: docker-compose.prod.yml
      appcheck_enabled: "true"
    secrets: inherit
