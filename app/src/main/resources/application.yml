server:
  port: 8080

spring:
  application:
    name: aircheck-server
    
  # Database
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aircheck}
    username: ${DB_USER:aircheck}
    password: ${DB_PASSWORD:aircheck}
    driver-class-name: org.mariadb.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
        
  # Cache
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

# 에어코리아 API 키
airkorea:
  api-key: ${AIRKOREA_API_KEY:your-api-key-here}

# Firebase (FCM)
firebase:
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,caches
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.seriouschoi.aircheck: DEBUG
    org.hibernate.SQL: DEBUG

# Swagger UI (#15)
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
