server:
  port: 8080

spring:
  application:
    name: aircheck-server
    
  # Database
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aircheck}
    username: ${DB_USER:aircheck}
    password: ${DB_PASSWORD:aircheck}
    driver-class-name: org.mariadb.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
        
  # Cache
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

# 날씨 API 설정
weather:
  provider: ${WEATHER_PROVIDER:openmeteo}  # openmeteo 또는 kma

# 에어코리아 API 키
airkorea:
  api-key: ${AIRKOREA_API_KEY:your-api-key-here}

# 기상청 API (공공데이터포털 - 에어코리아와 동일 키)
kma:
  api:
    key: ${AIRKOREA_API_KEY:}

# Firebase
firebase:
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
  key-path: ${FIREBASE_KEY_PATH:/opt/aircheck/firebase-key.json}
  project-id: ${FIREBASE_PROJECT_ID:air-check-7e17e}
  project-number: ${FIREBASE_PROJECT_NUMBER:929627870632}

# App Check
appcheck:
  enabled: ${APPCHECK_ENABLED:false}

# Admin API
admin:
  api-key: ${ADMIN_API_KEY:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,caches
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.seriouschoi.aircheck: DEBUG
    org.hibernate.SQL: DEBUG

# Swagger UI (#15)
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
