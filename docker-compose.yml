# 로컬 개발용 compose 파일. 운영 서버용은 docker-compose.prod.yml (#52) — 둘이 다른 이유는 그 파일 상단 주석 참고.
# 아래 DB 계정정보는 로컬 개발용 값이며, 운영 DB 비밀번호와는 무관함.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - AIRKOREA_API_KEY=${AIRKOREA_API_KEY}
      - FIREBASE_CREDENTIALS_JSON=${FIREBASE_CREDENTIALS_JSON}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=aircheck
      - DB_USER=aircheck
      - DB_PASSWORD=aircheck
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=aircheck
      - MYSQL_USER=aircheck
      - MYSQL_PASSWORD=aircheck
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mariadb_data:
